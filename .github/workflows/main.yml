name: CI/CD Pipeline with SonarCloud, Gemini Vertex AI, and Cloud Run

on:
  push:
      branches: [ "main", "develop" ] # รันเมื่อมีการ Push ตรงเข้า main หรือ develop
  pull_request:
      branches: [ "main", "develop" ] # รันเมื่อมีการสร้าง/อัปเดต PR ไปยัง main หรือ develop
      types: [opened, synchronize, reopened] # รันเมื่อเปิด PR, อัปเดตโค้ดใน PR, หรือเปิด PR ซ้ำ
  workflow_dispatch:

env:
  PROJECT_ID: project-6840ef2a-d272-45b3-a6b
  REGION: asia-southeast1
  SERVICE_NAME: hello-fastapi
  ARTIFACT_REPO: hello-fastapi-registry
  IMAGE_NAME: hello-fastapi-image

jobs:
  analysis-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # 1. SonarCloud Scan (ต้องการไฟล์ sonar-project.properties ที่ root)
      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 2. Authenticate to Google Cloud (ทำก่อนใช้ Gemini CLI เพื่อให้ใช้ ADC ได้)
      - id: 'auth'
        name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      # 3. AI Insights with Gemini (Vertex AI)
      - name: AI Code Insights with Gemini
        uses: google-github-actions/run-gemini-cli@v0
        with:
          provider: 'vertex'
          project_id: ${{ env.PROJECT_ID }}
          location: 'us-central1' # Vertex AI มักนิยมใช้ภูมิภาคนี้หรือ asia-southeast1 (ถ้าเปิดใช้)
          model: 'gemini-2.5-flash-lite'
          prompt: "Please analyze this Python code for logic errors and suggest optimizations."
          files: "main.py"

      # 4. Build and Push Docker Image
      - name: Build and Push to Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 5. Deploy to Cloud Run
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          flags: '--allow-unauthenticated'