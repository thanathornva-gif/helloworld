name: CI/CD Pipeline

on:
  push:
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+'

env:
  PROJECT_ID: ${{ vars.PROJECT_ID }}
  REGION: ${{ vars.REGION }}
  SERVICE_NAME: ${{ vars.SERVICE_NAME }}
  ARTIFACT_REPO: ${{ vars.ARTIFACT_REPO }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}
  GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}

jobs:
  # Job 1 Unit Testing
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest -r requirements.txt
      - name: Run Tests
        run: pytest

  # Job 2 Analysis
  analysis:
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get Component Key from properties
        id: get_key
        run: |
          PROP_KEY=$(grep 'sonar.projectKey' sonar-project.properties | cut -d'=' -f2 | xargs)
          echo "SONAR_KEY=$PROP_KEY" >> $GITHUB_ENV
          echo "detected Project Key: $PROP_KEY"

      - name: Fetch SonarCloud Issues Report
        run: |
          curl -u "${{ secrets.SONAR_TOKEN }}:" \
            "https://sonarcloud.io/api/issues/search?componentKeys=${{ env.SONAR_KEY }}&resolved=false" \
            -o sonar-report.json
          
          if [ ! -s sonar-report.json ]; then
            echo "{ \"issues\": [], \"message\": \"No issues found or API error\" }" > sonar-report.json
          fi

      - name: Prepare Gemini CLI Environment
        run: |
          mkdir -p ~/.gemini
          echo '{"projects": {}}' > ~/.gemini/projects.json

      - name: Authenticate to Google Cloud
        id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Gemini AI Analysis of Sonar Report
        uses: google-github-actions/run-gemini-cli@v0
        with:
          provider: 'google-ai'
          model: ${{ env.GEMINI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          project_id: ${{ env.PROJECT_ID }}
          files: "main.py, sonar-report.json"
          prompt: |
            Analyze the sonar-report.json file (which contains the results from SonarCloud)
            along with the code in main.py, and summarize the findings in Markdown format:
            1. Summarize the number and severity of the problems found.
            2. Describe the most critical issues and their solutions (referencing lines in main.py if available).
            3. Provide additional recommendations for improving the security of this FastAPI according to OWASP standards.

  # Job 3 Build and Deployment
  deploy:
    needs: [unit-test, analysis]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Authenticate to Google Cloud
        id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Build and Push to Artifact Registry
        run: |
          VERSION=${{ github.ref_name }}
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
          FULL_IMAGE_NAME=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:$VERSION
          docker build -t $FULL_IMAGE_NAME .
          docker push $FULL_IMAGE_NAME

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:$VERSION
          flags: '--allow-unauthenticated'