name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  PROJECT_ID: project-6840ef2a-d272-45b3-a6b
  REGION: asia-southeast1
  SERVICE_NAME: hello-fastapi
  ARTIFACT_REPO: hello-fastapi-registry
  IMAGE_NAME: hello-fastapi-image

jobs:
  # --- Job 1: Unit Testing ---
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest -r requirements.txt
      - name: Run Tests
        run: pytest

  # --- Job 2: Static & AI Analysis (ทำไปพร้อมกับ Test ได้เลย) ---
  analysis:
    needs: unit-test # จะรันก็ต่อเมื่อ Unit Test ผ่านแล้วเท่านั้น (หรือจะลบบรรทัดนี้ออกเพื่อรันขนานกันก็ได้)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # ดึง Component Key จากไฟล์ Properties ---
      - name: Get Component Key from properties
        id: get_key
        run: |
          PROP_KEY=$(grep 'sonar.projectKey' sonar-project.properties | cut -d'=' -f2 | xargs)
          echo "SONAR_KEY=$PROP_KEY" >> $GITHUB_ENV
          echo "detected Project Key: $PROP_KEY"

      # --- ขั้นตอนดึง Report โดยใช้ค่าที่ดึงมาได้ ---
      - name: Fetch SonarCloud Issues Report
        run: |
          curl -u "${{ secrets.SONAR_TOKEN }}:" \
            "https://sonarcloud.io/api/issues/search?componentKeys=${{ env.SONAR_KEY }}&resolved=false" \
            -o sonar-report.json
          
          if [ ! -s sonar-report.json ]; then
            echo "{ \"issues\": [], \"message\": \"No issues found or API error\" }" > sonar-report.json
          fi

      - name: Prepare Gemini CLI Environment
        run: |
          mkdir -p ~/.gemini
          echo '{"projects": {}}' > ~/.gemini/projects.json

      - name: Gemini AI Analysis of Sonar Report
        uses: google-github-actions/run-gemini-cli@v0
        with:
          provider: 'google-ai'
          google_api_key: ${{ secrets.GEMINI_API_KEY }}
          model: 'gemini-2.5-flash-lite'
          files: "main.py, sonar-report.json"
          prompt: |
            Analyze the sonar-report.json file (which contains the results from SonarCloud)
            along with the code in main.py, and summarize the findings in Markdown format:
            1. Summarize the number and severity of the problems found.
            2. Describe the most critical issues and their solutions (referencing lines in main.py if available).
            3. Provide additional recommendations for improving the security of this FastAPI according to OWASP standards.

  # --- Job 3: Build and Deployment ---
  deploy:
    # เงื่อนไขสำคัญ: ต้องผ่านทั้ง Test และ Analysis และต้องเป็นเหตุการณ์ Push (Merge) เท่านั้น
    needs: [unit-test, analysis]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Build and Push to Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
          TAG=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker build -t $TAG .
          docker push $TAG

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          flags: '--allow-unauthenticated'